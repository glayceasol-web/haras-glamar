/* Layout: barra lateral preta com a logo GM no topo e o cavalo em chamas surgindo no rodapé; área de trabalho clara; no celular a barra vira um topo com abas roláveis */
:root{
  --bg:#f4f3f1; --surface:#ffffff; --surface-2:#f8f7f5; --ink:#171615; --muted:#5f5b56; --line:#e1ded9;
  --brand:#171615; --brand-ink:#ffffff; --accent:#c95a17; --accent-soft:#fbe7d8;
  --pos:#2b7a4b; --pos-soft:#e1f1e6; --neg:#b3392a; --neg-soft:#f8e1dc; --warn:#a46c12; --warn-soft:#f6ead2;
  --side-bg:#0a0a0a; --side-ink:#ece9e4; --side-muted:#9c968f; --side-active:#1d1b19;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.06);
  --f-display:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --brand:#e8762e; --brand-ink:#170c05; --accent:#f08a3e; --accent-soft:#3b2414;

  --side-bg:#050505; --side-ink:#ece9e4; --side-muted:#8f8a83; --side-active:#1c1a18;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.93em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

inear-gradient(to bottom,transparent,#000 55%)}
.brandbox{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.logo-slot{width:100%;min-height:84px;border:1.5px dashed var(--side-muted);border-radius:var(--r);display:flex;align-items:center;justify-content:center;background:transparent;color:var(--side-muted);cursor:pointer;padding:10px;text-align:center;font-size:13px}
.logo-slot:hover{border-color:var(--side-ink);color:var(--side-ink)}
.logo-slot.has{border:0;padding:0;min-height:0;cursor:default;justify-content:flex-start}
.logo-slot img{width:100%;max-width:200px;max-height:200px;object-fit:contain;border-radius:6px;display:block}
.farm-name{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.06em}
.farm-sub{font-size:12px;color:var(--side-muted);text-transform:uppercase;letter-spacing:.09em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--side-ink);text-decoration:none;padding:9px 11px;border-radius:8px;display:flex;align-items:center;gap:10px;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;opacity:.8}
.nav a:hover{background:var(--side-active)}
.nav a[aria-current="page"]{background:var(--side-active);box-shadow:inset 3px 0 0 #f07a2e}
.side .btn{background:rgba(0,0,0,.4);border-color:var(--side-muted);color:var(--side-ink)}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-ink);text-shadow:0 1px 3px #000}

.main{min-width:0;padding-block:22px 48px;padding-left:max(16px,min(4vw,40px));padding-right:max(16px,env(safe-area-inset-right,0px),min(4vw,40px))}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.topbar h1{font-size:28px;font-weight:600;letter-spacing:.02em}
.topbar .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:var(--surface)}
.btn.small{padding:5px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}

.status-note{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--pos)} .dot.warn{background:var(--warn)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .val{white-space:nowrap;font-family:var(--f-num);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:12.5px;color:var(--muted)}
.kpi.pos .val{color:var(--pos)} .kpi.neg .val{color:var(--neg)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:19px;font-weight:600;margin-bottom:12px}
.panel h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 200px}
.toolbar input[type=search]{width:100%}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line);border-bottom:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.pill.in{background:var(--pos-soft);color:var(--pos)}
.pill.out{background:var(--neg-soft);color:var(--neg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.brass{background:var(--accent-soft);color:var(--accent)}
.amt-in{color:var(--pos)} .amt-out{color:var(--neg)}

.list{display:flex;flex-direction:column}
.list .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.list .row:last-child{border-bottom:0}
.list .row .sub{font-size:12.5px;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar-row .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar-row .fill{height:100%;background:var(--accent)}
.bar-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(10,18,13,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal header h2{font-size:21px;font-weight:600}
.modal form{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field .help{font-size:12.5px;color:var(--muted)}
.field.check{flex-direction:row;align-items:center;gap:8px}
.field.check label{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500}
.modal footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.modal footer .right{display:flex;gap:8px;margin-left:auto}
@media (max-width:560px){.modal form{grid-template-columns:1fr}}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 11px;font-size:13.5px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);width:22px;height:22px;border-radius:50%;line-height:1}
.chip button:hover{background:var(--neg-soft);color:var(--neg)}
.chip-add{display:flex;gap:6px;margin-top:8px}
.chip-add input{flex:1}
.foto-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.foto-prev{width:150px;aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.foto-prev img{width:100%;height:100%;object-fit:cover}
.foto-acts{display:flex;flex-direction:column;gap:6px;align-items:flex-start;flex:1 1 180px;min-width:0}
.form-sec{grid-column:1/-1;font-size:16px;margin:8px 0 -4px;padding-top:12px;border-top:1px solid var(--line);color:var(--accent)}
.parc{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:center;font-size:14px}
.parc .pg{color:var(--pos)} .parc .at{color:var(--neg)}
.cons{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.ped .cell.comum{outline:2px solid var(--warn);outline-offset:-1px}
.foto-acts label.btn{text-transform:none;letter-spacing:0;color:var(--ink);font-size:13px;cursor:pointer}
.ped-wrap{overflow-x:auto;grid-column:1/-1}
.ped{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));grid-template-rows:repeat(8,auto);gap:4px 8px;min-width:540px}
.ped .cell{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.ped .cell.mac{border-left:4px solid #3d6fb4}
.ped .cell.fem{border-left:4px solid #c2457a}
.ped .cell .rot{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ped .cell .nm{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.ped .cell .nm.vazio{color:var(--muted);font-weight:400}
.ped .cell input{padding:4px 6px;font-size:13.5px;width:100%}
.ped .g1 .nm{font-size:15px}
.ped-sub{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.ficha-a{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card,transparent)}
.ficha-a img,.ficha-sem{width:84px;height:84px;border-radius:10px;object-fit:cover;flex:none}
.ficha-sem{display:grid;place-items:center;background:var(--line);color:var(--muted);font-size:12px}
.ficha-a strong{display:block;font-size:15.5px}.ficha-p{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ped-sub img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.ped-sub h3{font-size:20px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block}
.thumb-empty{background:var(--surface-2);border:1px solid var(--line)}
td:has(.thumb){padding-block:5px;width:56px}
.sublist{display:flex;flex-direction:column;gap:8px}
.subrow{display:grid;grid-template-columns:1.4fr 1.1fr .8fr 1.1fr auto;gap:6px;align-items:center}
.subrow input{width:100%}
.subhead{display:grid;grid-template-columns:1.4fr 1.1fr .8fr 1.1fr 34px;gap:6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:560px){.subrow{grid-template-columns:1fr 1fr;padding:8px;border:1px solid var(--line);border-radius:8px}.subhead{display:none}}
.calc{grid-column:1/-1;background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.calc .ln{display:flex;justify-content:space-between;gap:12px}
.calc .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.calc .t{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.note{font-size:13.5px;color:var(--muted);max-width:68ch}
.welcome{max-width:720px;margin:30px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:24px;align-items:center}

.login::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,5,5,.55),rgba(5,5,5,.85))}
.login-card{position:relative;width:min(380px,100%);background:var(--surface);color:var(--ink);border-radius:16px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;text-align:center}
.login-card h1{font-size:24px;letter-spacing:.05em}
.login-logo{width:120px;height:120px;border-radius:12px;margin:0 auto;object-fit:cover;background:#000}
.login-card form{display:flex;flex-direction:column;gap:12px;text-align:left;margin-top:6px}
.login-card .btn.ghost{align-self:center}
.login-msg{min-height:1.2em;margin:0;font-size:13.5px;color:var(--neg);text-align:center}
.login-foot{font-size:12px;color:var(--muted);margin:6px 0 0}
.ex-flag{font-size:11.5px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:relative;height:auto;padding-block:14px 8px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}
  .side::after{height:100%;left:auto;width:70%;background-position:center 18%;opacity:.42;-webkit-mask-image:linear-gradient(to right,transparent,#000 70%);mask-image:linear-gradient(to right,transparent,#000 70%)}
  .brandbox{flex-direction:row;align-items:center}
  .logo-slot{width:auto;min-height:52px;min-width:120px}
  .logo-slot.has{min-width:0}
  .logo-slot img{max-height:64px;width:64px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .side-foot{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar h1{font-size:25px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi .val{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav a{transition:background .15s,border-color .15s}}

  });

function inPeriod(iso){if(!iso)return UI.modo==="tudo";if(UI.modo==="tudo")return true;if(UI.modo==="ano")return iso.slice(0,4)===UI.mes.slice(0,4);return iso.slice(0,7)===UI.mes}

function monthsInPeriod(){if(UI.modo==="mes")return 1;if(UI.modo==="ano"){const y=UI.mes.slice(0,4);const nowY=today().slice(0,4);return y===nowY?+today().slice(5,7):12}
  const ds=[...arr("lancamentos"),...arr("alimentacao")].map(x=>x.data).filter(Boolean).sort();if(!ds.length)return 1;const a=ds[0],b=ds[ds.length-1];return Math.max(1,(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7))+1)}

function alimTotal(a){return parseNum(a.quantidade)*parseNum(a.custoUnit)}

function resumoFin(){
  let ent=0,sai=0,aRec=0,aPag=0;
  arr("lancamentos").filter(l=>inPeriod(l.data)).forEach(l=>{const v=parseNum(l.valor);if(l.tipo==="Entrada"){ent+=v;if(l.situacao==="Pendente")aRec+=v}else{sai+=v;if(l.situacao==="Pendente")aPag+=v}});
  const alim=arr("alimentacao").filter(a=>inPeriod(a.data)).reduce((s,a)=>s+alimTotal(a),0);
  return{ent,sai,saldo:ent-sai,aRec,aPag,alim};
}
function custoPorAnimal(){
  const ativos=animaisAtivos();const n=ativos.length||1;const naoRat=new Set(L("naoRatear"));
  const linhas={};ativos.forEach(a=>linhas[a.id]={animal:a,alim:0,direto:0,rateio:0,receita:0});
  const ensure=id=>{if(!linhas[id]&&S.animais[id])linhas[id]={animal:S.animais[id],alim:0,direto:0,rateio:0,receita:0};return linhas[id]};
  let geral=0,alimGeral=0;
  arr("lancamentos").filter(l=>inPeriod(l.data)).forEach(l=>{const v=parseNum(l.valor);
    if(l.tipo==="Entrada"){if(l.animal&&ensure(l.animal))linhas[l.animal].receita+=v;return}
    if(l.animal&&ensure(l.animal)){linhas[l.animal].direto+=v;return}
    if(l.cocheira){const occ=ativos.filter(a=>a.cocheira===l.cocheira);if(occ.length){occ.forEach(a=>linhas[a.id].direto+=v/occ.length);return}}
    if(!naoRat.has(l.categoria))geral+=v;});
  arr("alimentacao").filter(a=>inPeriod(a.data)).forEach(a=>{const v=alimTotal(a);if(a.animal&&ensure(a.animal))linhas[a.animal].alim+=v;else alimGeral+=v});
  arr("cascos").filter(c=>inPeriod(c.data)&&!c.lancado&&c.animal).forEach(c=>{if(ensure(c.animal))linhas[c.animal].direto+=parseNum(c.valor)});
  arr("competicoes").filter(c=>inPeriod(c.dataCompeticao)&&!c.lancado&&c.animal).forEach(c=>{if(ensure(c.animal)){linhas[c.animal].comp=(linhas[c.animal].comp||0)+compDireto(c)}});
  if(ativos.length){ativos.forEach(a=>{linhas[a.id].alim+=alimGeral/n;if(S.cfg.rateio)linhas[a.id].rateio+=geral/n})}
  const out=Object.values(linhas).map(r=>{r.comp=r.comp||0;const t=r.alim+r.direto+r.rateio+r.comp;return Object.assign(r,{total:t,resultado:r.receita-t})});
  out.sort((a,b)=>b.total-a.total);return{linhas:out,geral,alimGeral,naoRateado:!S.cfg.rateio?geral:0};
}
function saldoEstoque(e){return parseNum(e.quantidade)}
function consumoDia(e){
  if(parseNum(e.consumoDiaFixo)>0)return{v:parseNum(e.consumoDiaFixo),fonte:"informado"};
  if(parseNum(e.consumoAnimalDia)>0){const n=parseNum(e.nAnimais)||animaisAtivos().length;return{v:parseNum(e.consumoAnimalDia)*n,fonte:`${numFmt(e.consumoAnimalDia)} × ${n} animais`}}
  const ini=addDias(today(),-30);let q=0;arr("alimentacao").forEach(a=>{if(a.estoqueId===e.id&&a.data>=ini&&a.data<=today())q+=parseNum(a.quantidade)});
  return q>0?{v:q/30,fonte:"média das baixas (30 dias)"}:{v:0,fonte:""}}
function previsao(e){
  const c=consumoDia(e);const qtd=parseNum(e.quantidade);const prazo=parseNum(e.prazoEntrega),marg=parseNum(e.margem),cob=parseNum(e.cobertura)||30;
  const abaixoMin=e.minimo!==""&&e.minimo!==undefined&&qtd<parseNum(e.minimo);
  if(!c.v)return{c,semConsumo:true,abaixoMin,diasAtePedir:abaixoMin?0:Infinity};
  const dias=qtd/c.v;const ate=dias-prazo-marg;
  const sug=Math.max(0,Math.ceil(c.v*(prazo+cob+marg)-qtd));
  return{c,dias,acaba:addDias(today(),Math.floor(dias)),pedirEm:addDias(today(),Math.max(0,Math.floor(ate))),diasAtePedir:abaixoMin?Math.min(0,ate):ate,sug,abaixoMin}}
function statusPedido(e){const p=previsao(e);
  if(p.diasAtePedir<=0)return{cls:"out",txt:"Pedir agora",p};
  if(p.semConsumo)return{cls:"neutral",txt:"Informe o consumo",p};
  if(p.diasAtePedir<=7)return{cls:"warn",txt:`Pedir em ${Math.ceil(p.diasAtePedir)} dia${Math.ceil(p.diasAtePedir)>1?"s":""}`,p};
  return{cls:"in",txt:"Pedir em "+dBR(p.pedirEm),p}}
const COMP_CUSTOS=[["taxa","Taxa"],["deslocamento","Deslocamento"],["alimentacao","Alimentação no evento"],["uniforme","Uniforme"],["treinamento","Treinamento"],["custoExtra","Custo extra de preparo"]];
function compDireto(c){return COMP_CUSTOS.reduce((s,[k])=>s+parseNum(c[k]),0)+(c.suplementos||[]).reduce((s,x)=>s+parseNum(x.valor),0)}
function addDias(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function diasEntre(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)+1}
function gastoAnimal(animal,ini,fim){let alim=0,desp=0;
  arr("alimentacao").forEach(a=>{if(a.animal===animal&&a.data>=ini&&a.data<=fim)alim+=alimTotal(a)});
  arr("lancamentos").forEach(l=>{if(l.tipo!=="Entrada"&&l.animal===animal&&l.categoria!=="Competições"&&l.data>=ini&&l.data<=fim)desp+=parseNum(l.valor)});
  return{alim,desp,total:alim+desp}}
function prepCalc(c){
  if(!c.animal||!c.dataInicioPrep||!c.dataCompeticao||c.dataInicioPrep>c.dataCompeticao)return null;
  const dias=diasEntre(c.dataInicioPrep,c.dataCompeticao);
  const prep=gastoAnimal(c.animal,c.dataInicioPrep,c.dataCompeticao);
  const bIni=addDias(c.dataInicioPrep,-90),bFim=addDias(c.dataInicioPrep,-1);
  const base=gastoAnimal(c.animal,bIni,bFim);const media=base.total/90;const esperado=media*dias;
  const extra=base.total>0?Math.max(0,prep.total-esperado):prep.total;
  return{dias,prep,media,esperado,extra,semHistorico:base.total===0}}
function compTotal(c){const p=prepCalc(c);return compDireto(c)+(p?p.extra:0)}
function calcHTML(c){
  const p=prepCalc(c);const d=compDireto(c);
  const ln=(a,b,cls="")=>`<div class="ln ${cls}"><span>${a}</span><span class="num">${b}</span></div>`;
  let h=`<span class="t">Resumo do custo</span>`;

  const sup=(c.suplementos||[]).reduce((s,x)=>s+parseNum(x.valor),0);if(sup)h+=ln("Suplementação / medicação informada",money(sup));
  h+=ln("<strong>Custos informados</strong>",`<strong>${money(d)}</strong>`);
  if(p){h+=ln(`Gasto do animal no preparo (${p.dias} dias)`,money(p.prep.total));
    h+=ln(`&nbsp;&nbsp;alimentação ${money(p.prep.alim)} · despesas vinculadas ${money(p.prep.desp)}`,"");
    h+=p.semHistorico?ln("Sem histórico nos 90 dias anteriores: todo o gasto do preparo conta como extra",""):ln(`Gasto normal esperado (média de ${money(p.media)}/dia nos 90 dias anteriores)`,"− "+money(p.esperado));
    h+=ln("<strong>Gasto extra do preparo</strong>",`<strong>${money(p.extra)}</strong>`)}
  else h+=ln("Preencha animal, início da preparação e data da competição para calcular o gasto extra do preparo","");
  h+=ln("Custo total da competição",money(d+(p?p.extra:0)),"tot");
  if(parseNum(c.premio))h+=ln("Resultado (prêmio − custo)",money(parseNum(c.premio)-d-(p?p.extra:0)));
  return h}

/* ---------- formulário em janela ---------- */
function fieldHTML(f,val,form){
  const id="f_"+f.k;const req=f.req?" required":"";const ph=f.ph?` placeholder="${esc(f.ph)}"`:"";
  let inp="";
  if(f.t==="pedigree"){return `<div class="field full" data-k="${f.k}" data-ped="${f.k}"><label>${esc(f.l)}</label>${f.help?`<span class="help">${esc(f.help)}</span>`:""}${pedHTML(val,f.k)}</div>`}
  if(f.t==="foto"){return `<div class="field${f.full?" full":""} foto-field" data-k="${f.k}" data-foto="${f.k}"><label>${esc(f.l)}</label><div class="foto-box"><div class="foto-prev">${val?`<img src="${esc(val)}" alt="Foto do animal">`:`<span>Sem foto</span>`}</div><div class="foto-acts"><label class="btn small" for="${id}">${val?"Trocar foto":"Escolher foto"}</label><input type="file" id="${id}" accept="image/*" hidden>${val?`<button type="button" class="btn small ghost" data-fotodel>Remover</button>`:""}${f.full?`<span class="help">Do celular dá para tirar a foto na hora. A imagem é reduzida automaticamente.</span>`:""}</div></div><input type="hidden" name="${f.k}" value="${esc(val||"")}"></div>`}
  if(f.t==="list"){const rows=Array.isArray(val)?val:[];
    return `<div class="field full" data-k="${f.k}" data-list="${f.k}"><label>${esc(f.l)}</label><div class="subhead">${f.sub.map(x=>`<span>${esc(x.l)}</span>`).join("")}<span></span></div><div class="sublist">${rows.map(r=>subRowHTML(f,r)).join("")}</div><div><button type="button" class="btn small" data-subadd="${f.k}">+ Adicionar item</button></div></div>`}
  if(f.t==="select"){const os=f.opts(form);const cur=val??"";let has=os.some(o=>String(o.v)===String(cur));
    inp=`<select id="${id}" name="${f.k}"${req}>${(!has&&cur!=="")?`<option value="${esc(cur)}" selected>${esc(cur)}</option>`:""}${os.map(o=>`<option value="${esc(o.v)}"${String(o.v)===String(cur)?" selected":""}>${esc(o.t)}</option>`).join("")}</select>`}
  else if(f.t==="textarea")inp=`<textarea id="${id}" name="${f.k}"${ph}>${esc(val)}</textarea>`;
  else if(f.t==="date")inp=`<input type="date" id="${id}" name="${f.k}" value="${esc(val)}"${req}>`;
  else if(f.t==="money")inp=`<input type="text" inputmode="decimal" id="${id}" name="${f.k}" value="${val===undefined||val===""?"":esc(String(val).replace(".",","))}" placeholder="0,00"${req}>`;
  else if(f.t==="number")inp=`<input type="text" inputmode="decimal" id="${id}" name="${f.k}" value="${val===undefined||val===""?"":esc(String(val).replace(".",","))}"${req}>`;
  else if(f.sugg){const dl="dl_"+f.k;inp=`<input type="text" id="${id}" name="${f.k}" value="${esc(val)}" list="${dl}" autocomplete="off"${ph}${req}><datalist id="${dl}">${f.sugg().map(v=>`<option value="${esc(v)}"></option>`).join("")}</datalist>`}
  else inp=`<input type="text" id="${id}" name="${f.k}" value="${esc(val)}"${ph}${req}>`;
  return `<div class="field${f.full?" full":""}" data-k="${f.k}"><label for="${id}">${esc(f.l)}${f.req?" *":""}</label>${inp}${f.help?`<span class="help">${esc(f.help)}</span>`:""}</div>`;
}
let subSeq=0;
function subRowHTML(f,r){r=r||{};subSeq++;return `<div class="subrow">${f.sub.map(x=>`<input type="text" data-sk="${x.k}" id="sub_${f.k}_${subSeq}_${x.k}" aria-label="${esc(x.l)}" placeholder="${esc(x.ph||x.l)}"${x.money?' inputmode="decimal"':""} value="${esc(x.money&&r[x.k]!==undefined&&r[x.k]!==""?String(r[x.k]).replace(".",","):r[x.k]??"")}">`).join("")}<button type="button" class="btn small ghost" data-subdel aria-label="Remover item">✕</button></div>`}
function readForm(form,fields){const o={};fields.forEach(f=>{if(f.fin&&!can("fin"))return;if(f.t==="pedigree"){const g={};PED_KEYS.forEach(([k])=>{const el=form.elements[f.k+"__"+k];if(el&&el.value.trim())g[k]=el.value.trim()});o[f.k]=g;return}if(f.t==="foto"){o[f.k]=form.elements[f.k]?form.elements[f.k].value:"";return}if(f.t==="list"){const box=form.querySelector(`[data-list="${f.k}"]`);o[f.k]=box?[...box.querySelectorAll(".subrow")].map(row=>{const r={};f.sub.forEach(x=>{const v=row.querySelector(`[data-sk="${x.k}"]`).value.trim();r[x.k]=x.money?(v===""?"":parseNum(v)):v});return r}).filter(r=>f.sub.some(x=>r[x.k]!==""&&r[x.k]!==undefined)):[];return}const el=form.elements[f.k];if(!el)return;let v=el.value;if(f.t==="money"||f.t==="number")v=v.trim()===""?"":parseNum(v);else v=v.trim();o[f.k]=v});return o}

function openForm(col,id,preset){
  const m=MOD[col];const rec=id?Object.assign({},S[col][id]):Object.assign({},preset||{});
  if(!id)m.fields.forEach(f=>{if(rec[f.k]===undefined&&f.def!==undefined)rec[f.k]=typeof f.def==="function"?f.def():f.def});
  const root=$("#modalRoot");
  root.innerHTML=`<div class="modal-back" id="mb"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"${m.fields.some(f=>f.t==="pedigree")?' style="width:min(880px,100%)"':""}>

// baixa de estoque da alimentação: desfaz a baixa anterior e aplica a nova
function applyStock(prev,next){
  const adj={};
  if(prev&&prev.baixa&&prev.baixa.id){adj[prev.baixa.id]=(adj[prev.baixa.id]||0)+parseNum(prev.baixa.qtd)}
  if(next){if(next.estoqueId&&S.estoque[next.estoqueId]){const q=parseNum(next.quantidade);next.baixa={id:next.estoqueId,qtd:q};adj[next.estoqueId]=(adj[next.estoqueId]||0)-q}else next.baixa=null}
  Object.entries(adj).forEach(([eid,d])=>{const e=S.estoque[eid];if(!e||!d)return;put("estoque",Object.assign({},e,{quantidade:Math.round((parseNum(e.quantidade)+d)*1000)/1000}))});
}

const PED_KEYS=[["p",1,1,4],["m",1,5,4],["pp",2,1,2],["pm",2,3,2],["mp",2,5,2],["mm",2,7,2],["ppp",3,1,1],["ppm",3,2,1],["pmp",3,3,1],["pmm",3,4,1],["mpp",3,5,1],["mpm",3,6,1],["mmp",3,7,1],["mmm",3,8,1]];
function pedRot(k){if(k.length===1)return k==="p"?"Pai":"Mãe";const lado=k[0]==="p"?"paterno":"materno",sx=k[k.length-1]==="p";if(k.length===2)return (sx?"Avô ":"Avó ")+(sx?lado:lado.replace("o","a").replace(/o$/,"a"));return sx?"Bisavô":"Bisavó"}
function pedHTML(g,editName){g=g||{};const com=editName?[]:ancestraisComuns(g);return `<div class="ped-wrap"><div class="ped">${PED_KEYS.map(([k,col,row,span])=>`<div class="cell g${col} ${k.endsWith("p")?"mac":"fem"}${com.includes(normNome(g[k]))?" comum":""}" style="grid-column:${col};grid-row:${row} / span ${span}"><span class="rot">${pedRot(k)}</span>${editName?`<input type="text" name="${editName}__${k}" id="${editName}__${k}" value="${esc(g[k]||"")}" placeholder="Nome / registro" aria-label="${pedRot(k)}">`:`<span class="nm${g[k]?"":" vazio"}">${esc(g[k]||"—")}</span>`}</div>`).join("")}</div></div>`}
function pedVazio(g){return !g||PED_KEYS.every(([k])=>!g[k])}
function nNome(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
// acha o animal cadastrado pelo nome, tolerando acentos, maiúsculas, nome abreviado ("Okane") ou parecido
function animalDe(nome){const n=nNome(nome);if(!n)return null;const A=arr("animais");
  let a=A.find(x=>nNome(x.nome)===n)||A.find(x=>x.apelido&&nNome(x.apelido)===n);if(a)return a;
  let c=A.filter(x=>{const m=nNome(x.nome);return m&&(m.startsWith(n+" ")||n.startsWith(m+" "))});if(c.length===1)return c[0];
  const w=n.split(" ")[0];if(w.length<3)return null;c=A.filter(x=>nNome(x.nome).split(" ")[0]===w);return c.length===1?c[0]:null}
function pedDoAnimal(nome){const a=animalDe(nome);return a&&!pedVazio(a.genealogia)?a.genealogia:null}
// genealogia do potro: pai = garanhão, mãe = doadora, e as gerações acima vêm das genealogias deles
function pedPotro(r){const G=(!pedVazio(r.genealogiaGaranhao)&&r.genealogiaGaranhao)||pedDoAnimal(r.garanhao)||{},D=(!pedVazio(r.genealogiaDoadora)&&r.genealogiaDoadora)||pedDoAnimal(r.doadora)||{};const ga=animalDe(r.garanhao),da=animalDe(r.doadora);const o={p:ga?ga.nome:r.garanhao,m:da?da.nome:r.doadora};
  ["p","m","pp","pm","mp","mm"].forEach(k=>{o["p"+k]=G[k]||"";o["m"+k]=D[k]||""});return o}
function normNome(s){return String(s||"").toLowerCase().replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim()}
function ancestraisComuns(g){const lado=pre=>PED_KEYS.filter(([k])=>k.startsWith(pre)&&g[k]).map(([k])=>normNome(g[k])).filter(Boolean);const P=new Set(lado("p")),out=[];new Set(lado("m")).forEach(n=>{if(P.has(n))out.push(n)});return out}
function cartaoAnimal(papel,nome,fotoPropria){if(!nome)return"";const a=animalDe(nome);const f=fotoDe(nome,fotoPropria);
  const dados=a?[a.raca,a.pelagem,a.nascimento?idade(a.nascimento):"",a.registro?"Reg. "+a.registro:""].filter(Boolean).map(esc).join(" · "):"Não encontrei este nome em Animais. Cadastre lá para puxar foto e genealogia.";
  return `<div class="ficha-a">${f?`<img src="${esc(f)}" alt="">`:`<div class="ficha-sem" aria-hidden="true">sem foto</div>`}<div><span class="ficha-p">${esc(papel)}</span><strong>${esc(a?a.nome:nome)}</strong><div class="note">${dados}</div></div></div>`}
function fichaPais(r){return `<div class="ficha">${cartaoAnimal("Garanhão (pai)",r.garanhao,r.fotoGaranhao)}${cartaoAnimal("Doadora (mãe)",r.doadora,r.fotoDoadora)}${r.receptora?cartaoAnimal("Receptora",r.receptora):""}</div>`}
function abrirGenealogia(r){const g=pedPotro(r);const root=$("#modalRoot");const nome=r.nomePotro||(r.dataNascPotro?"Potro":"Futuro potro");
  root.innerHTML=`<div class="modal-back" id="mb"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" style="width:min(820px,100%)"><header><h2 id="mt">Ficha da reprodução</h2><button type="button" class="btn ghost small" id="mClose" aria-label="Fechar">✕</button></header>
  <div style="padding:16px 18px">${fichaPais(r)}<div class="ped-sub">${(r.nomePotro&&fotoDe(r.nomePotro,r.fotoPotro))||r.fotoPotro?`<img src="${esc(fotoDe(r.nomePotro,r.fotoPotro))}" alt="">`:""}<div><h3>${esc(nome)}</h3><div class="note">${esc(r.filiacao||`${g.p} × ${g.m}`)}${r.numeroRegistro?" · Reg. "+esc(r.numeroRegistro):""}${r.dataNascPotro?" · nascido em "+dBR(r.dataNascPotro):""}</div></div></div>${pedHTML(g)}
  ${(()=>{const comuns=ancestraisComuns(g);return comuns.length?`<div class="cons"><strong>Atenção: ancestrais em comum nos dois lados</strong> (${comuns.map(esc).join(", ")}). Isso indica parentesco entre o pai e a mãe; avalie a consanguinidade.</div>`:""})()}
  <p class="note" style="margin:12px 0 0">Os avós e bisavós vêm da genealogia preenchida para a doadora e para o garanhão, neste registro ou no cadastro deles em Animais.</p></div>
  <footer><div class="right"><button type="button" class="btn" id="mCancel">Fechar</button></div></footer></div></div>`;
  const close=()=>{root.innerHTML=""};$("#mClose").onclick=close;$("#mCancel").onclick=close;$("#mb").addEventListener("mousedown",e=>{if(e.target.id==="mb")close()})}
function resizeImg(file,max,q){return new Promise((ok,err)=>{const rd=new FileReader();rd.onerror=err;rd.onload=()=>{const img=new Image();img.onerror=err;img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};img.src=rd.result};rd.readAsDataURL(file)})}

function chart6(){
  const [y,m]=UI.mes.split("-").map(Number);const ms=[];for(let i=5;i>=0;i--){let mm=m-i,yy=y;while(mm<1){mm+=12;yy--}ms.push(`${yy}-${String(mm).padStart(2,"0")}`)}
  const data=ms.map(k=>{let e=0,s=0;arr("lancamentos").forEach(l=>{if((l.data||"").slice(0,7)!==k)return;if(l.tipo==="Entrada")e+=parseNum(l.valor);else s+=parseNum(l.valor)});return{k,e,s}});
  const max=Math.max(1,...data.map(d=>Math.max(d.e,d.s)));
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const c=[1,2,2.5,5,10].find(x=>x*p>=max);return c*p})();
  const W=560,H=230,pl=64,pr=8,pt=10,pb=28,cw=(W-pl-pr)/6,bw=Math.min(22,cw/3.2);
  const ys=v=>pt+(H-pt-pb)*(1-v/nice);
  let g="";for(let i=0;i<=4;i++){const v=nice*i/4;const yy=ys(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":Math.round(v)}</text>`}
  data.forEach((d,i)=>{const cx=pl+cw*i+cw/2;g+=`<rect x="${cx-bw-2}" y="${ys(d.e)}" width="${bw}" height="${Math.max(0,H-pb-ys(d.e))}" rx="3" fill="var(--pos)"><title>Entradas ${money(d.e)}</title></rect><rect x="${cx+2}" y="${ys(d.s)}" width="${bw}" height="${Math.max(0,H-pb-ys(d.s))}" rx="3" fill="var(--neg)"><title>Saídas ${money(d.s)}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="${d.k===UI.mes?"var(--ink)":"var(--muted)"}" font-weight="${d.k===UI.mes?700:400}">${MESES[+d.k.slice(5,7)-1]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por mês">${g}</svg><div class="legend"><span><i style="background:var(--pos)"></i>Entradas</span><span><i style="background:var(--neg)"></i>Saídas</span><span>Valores em R$</span></div>`;
}

    {l:"",h:x=>`<span style="display:inline-flex;gap:4px">${thumbH(fotoDe(x.doadora,x.fotoDoadora),x.doadora)}${thumbH(fotoDe(x.garanhao,x.fotoGaranhao),x.garanhao)}</span>`},
    {l:"Doadora × Garanhão",h:x=>`<strong>${esc((animalDe(x.doadora)||{}).nome||x.doadora)}</strong> × ${esc((animalDe(x.garanhao)||{}).nome||x.garanhao)}${x.receptora?`<div style="font-size:12.5px;color:var(--muted)">Receptora: ${esc(x.receptora)}</div>`:""}`,v:x=>x.doadora+" "+x.garanhao+" "+(x.receptora||""),wrap:1},
    {l:"Situação",h:x=>{const st=statusRepro(x);return `<span class="pill ${st.cls}">${st.txt}</span>`}},
    {l:"Parto previsto",h:x=>x.dataNascPotro?"":`<span class="num">${dBR(partoPrevisto(x))}</span>`},
    {l:"Potro",h:x=>x.dataNascPotro?`${fotoDe(x.nomePotro,x.fotoPotro)?`<img class="thumb" src="${esc(fotoDe(x.nomePotro,x.fotoPotro))}" alt="" style="float:left;margin-right:8px">`:""}<strong>${esc(x.nomePotro||"Sem nome")}</strong><div style="font-size:12.5px;color:var(--muted)">${dBR(x.dataNascPotro)}${x.sexoPotro?" · "+esc(x.sexoPotro):""}</div>`:"",v:x=>x.nomePotro},
    {l:"Registro / chip",h:x=>[x.numeroRegistro?"Reg. "+esc(x.numeroRegistro):"",x.chip?"Chip "+esc(x.chip):"",x.registroDefinitivo?`<span class="pill in">Definitivo</span>`:x.registroProvisorio?`<span class="pill warn">Provisório</span>`:""].filter(Boolean).join(" · ")},

    {l:"",h:x=>`<span style="display:inline-flex;gap:6px"><button type="button" class="btn small" data-ped-ver="${esc(x.id)}">Ficha e genealogia</button>${x.dataNascPotro&&!x.potroCadastrado&&can("edit")?`<button type="button" class="btn small" data-potro="${esc(x.id)}">Cadastrar potro</button>`:""}${custoInsem(x).total&&!x.lancado&&can("fin")?`<button type="button" class="btn small" data-replancar="${esc(x.id)}">Lançar custo</button>`:""}</span>`}

/* ---------- exportação ---------- */
async function offerFile(filename,data){
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename,data});toast("Arquivo pronto");return}}}catch(e){if(e&&e.code==="declined")return;console.warn(e)}
  try{const blob=new Blob([data],{type:filename.endsWith(".json")?"application/json":"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}catch(e){toast("Não foi possível baixar o arquivo aqui")}
}
const csvCell=v=>{v=v==null?"":String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const csvNum=v=>(v===""||v==null)?"":String(Math.round(parseNum(v)*100)/100).replace(".",",");
function exportCSV(col){
  const m=MOD[col];const rows=arr(col).filter(r=>["lancamentos","alimentacao"].includes(col)?inPeriod(r.data):col==="competicoes"?inPeriod(r.dataCompeticao):true);
  const head=m.fields.filter(f=>f.t!=="foto").map(f=>f.l);if(col==="alimentacao")head.push("Total (R$)");if(col==="competicoes")head.push("Custos informados (R$)","Gasto extra do preparo (R$)","Custo total (R$)");
  const lines=[head.map(csvCell).join(";")];
  rows.sort((a,b)=>String(a.data||a.dataCompeticao||a.dataInseminacao||a.nome||a.item||"").localeCompare(String(b.data||b.dataCompeticao||b.dataInseminacao||b.nome||b.item||""))).forEach(r=>{
    const cells=m.fields.filter(f=>f.t!=="foto").map(f=>{const v=r[f.k];if(f.t==="pedigree")return PED_KEYS.filter(([k])=>v&&v[k]).map(([k])=>pedRot(k)+": "+v[k]).join(" | ");if(f.t==="list")return (v||[]).map(x=>f.sub.map(sf=>sf.money?(x[sf.k]!==""&&x[sf.k]!=null?money(x[sf.k]):""):x[sf.k]).filter(Boolean).join(" / ")).join(" | ");if(f.t==="money"||f.t==="number")return csvNum(v);if(f.t==="date")return dBR(v);if(f.k==="animal")return animalNome(v);if(f.k==="cocheira")return cocheiraNome(v);if(f.k==="estoqueId")return estoqueNome(v);return v??""});
    if(col==="alimentacao")cells.push(csvNum(alimTotal(r)));if(col==="competicoes"){const p=prepCalc(r);cells.push(csvNum(compDireto(r)),csvNum(p?p.extra:0),csvNum(compTotal(r)))}lines.push(cells.map(csvCell).join(";"))});
  offerFile(`glamar-${col}-${UI.modo==="tudo"?"completo":UI.modo==="ano"?UI.mes.slice(0,4):UI.mes}.csv`,"﻿"+lines.join("\r\n"));
}
function exportCustoCSV(){const c=custoPorAnimal();const lines=[["Animal","Cocheira","Alimentação","Despesas diretas","Rateio geral","Competições","Custo total","Receitas","Resultado"].join(";")];c.linhas.forEach(l=>lines.push([l.animal.nome,cocheiraNome(l.animal.cocheira),l.alim,l.direto,l.rateio,l.comp,l.total,l.receita,l.resultado].map((v,i)=>i<2?csvCell(v):csvNum(v)).join(";")));offerFile(`glamar-custo-por-animal-${UI.modo==="tudo"?"completo":UI.mes}.csv`,"﻿"+lines.join("\r\n"))}
function exportJSON(){const o={app:"controle-haras-glamar",versao:1,exportadoEm:new Date().toISOString(),cfg:S.cfg};COLS.forEach(c=>o[c]=arr(c));offerFile(`backup-haras-glamar-${today()}.json`,JSON.stringify(o,null,1))}
$("#importFile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||o.app!=="controle-haras-glamar")throw 0;if(window.__merge){let n=0;COLS.forEach(c=>(o[c]||[]).forEach(x=>{if(x&&x.id){put(c,Object.assign({},S[c][x.id]||{},x));n++}}));render();toast(n+" cadastros importados")}else{replaceAll(o);toast("Backup restaurado")}}catch(err){toast("Esse arquivo não é um backup deste sistema")}};rd.readAsText(f)});
function replaceAll(o){
  COLS.forEach(c=>Object.keys(S[c]).forEach(id=>{if(!(o[c]||[]).some(x=>x.id===id))del(c,id)}));
  if(o.cfg){S.cfg=mergeCfg(o.cfg);S.cfg.iniciado=true;putCfg()}
  COLS.forEach(c=>(o[c]||[]).forEach(x=>{if(x&&x.id)put(c,x)}));render();
}
function wipeAll(){COLS.forEach(c=>Object.keys(S[c]).forEach(id=>del(c,id)));S.cfg.iniciado=true;putCfg();render();toast("Todos os registros foram apagados")}

<script>
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
(function(){let ev=null;const b=document.getElementById("pwaInstall");
  const inst=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;if(!inst)b.hidden=false});
  b.addEventListener("click",async()=>{if(!ev)return;ev.prompt();await ev.userChoice;ev=null;b.hidden=true});
